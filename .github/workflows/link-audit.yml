name: Weekly internal link audit
on:
  schedule:
    - cron: '25 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build static routes
        run: python3 scripts/build_site.py
      - name: Run internal link audit
        run: python3 scripts/audit_internal_links.py
      - name: Upload generated site summary
        run: |
          echo "HTML pages: $(find dist -name '*.html' | wc -l)" > link-audit.txt
          echo "Build date: $(date -u +%FT%TZ)" >> link-audit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-audit-summary
          path: link-audit.txt
