name: Finance OS release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          version = str(json.load(open("package.json", encoding="utf-8"))["version"])
          expected = "v" + version
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              sys.exit(f"Tag {actual} does not match package.json version {expected}")
          print("Release version verified:", expected)
          PY
      - name: Verify homepage and cache version
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          version = str(json.loads(pathlib.Path("package.json").read_text())["version"])
          checks = {
              "homepage badge": f"v{version}" in pathlib.Path("index.html").read_text(),
              "service-worker cache": f"fios-shell-v{version}" in pathlib.Path("sw.js").read_text(),
          }
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " " + name)
          if not all(checks.values()):
              sys.exit(1)
          PY
      - name: Build production-shaped static output
        env:
          SITE_URL: https://finance-intelligence-os-whizz444yt-7353.vercel.app
        run: python3 scripts/build_site.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Run structural and security validation
        env:
          SITE_URL: https://finance-intelligence-os-whizz444yt-7353.vercel.app
        run: python3 scripts/validate.py
      - name: Audit internal links
        run: python3 scripts/audit_internal_links.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Finance Intelligence OS ${GITHUB_REF_NAME}" --generate-notes --verify-tag
