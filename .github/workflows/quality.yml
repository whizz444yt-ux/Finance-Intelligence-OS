name: Finance OS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runtime
        run: |
          python3 --version
          node --version
      - name: Build static routes
        run: python3 scripts/build_site.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Structural and security validation
        run: python3 scripts/validate.py
      - name: Internal link and anchor audit
        run: python3 scripts/audit_internal_links.py
