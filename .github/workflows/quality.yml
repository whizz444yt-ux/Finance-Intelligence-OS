name: Finance OS quality gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runtime
        run: |
          python3 --version
          node --version
      - name: Build static routes
        run: python3 scripts/build_site.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify release version consistency
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          version = str(json.loads(pathlib.Path("package.json").read_text())["version"])
          parts = version.split(".")
          if len(parts) != 3 or any(not part.isdigit() for part in parts):
              sys.exit("package.json must contain a semantic version")
          checks = {
              "homepage release badge": f"v{version}" in pathlib.Path("index.html").read_text(),
              "service-worker cache": f"v{version}" in pathlib.Path("sw.js").read_text() and "CACHE_NAME = CACHE_PREFIX" in pathlib.Path("sw.js").read_text(),
          }
          for label, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " " + label)
          if not all(checks.values()):
              sys.exit(1)
          PY
      - name: Structural and security validation
        run: python3 scripts/validate.py
      - name: Internal link and anchor audit
        run: python3 scripts/audit_internal_links.py
